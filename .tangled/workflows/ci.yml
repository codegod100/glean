when:
  - event: ["push"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]

engine: "nixery"

# using the default values
clone:
  skip: false
  depth: 1

dependencies:
  nixpkgs:
    - go
    - gcc
    - gnumake
    - gnugrep
    - gawk
    - nodejs

steps:
  - name: "Install node dependencies"
    command: "npm install"

  - name: "Build glean"
    command: "make build"

  - name: "Run tests"
    command: "make test"
