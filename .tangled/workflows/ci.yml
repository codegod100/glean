when:
  - event: ["push"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]

engine: "nixery"

# using the default values
clone:
  skip: false
  depth: 1

# The repo is a nix flake (flake.nix): `nix build`/`nix develop` reproduce this
# environment exactly. The nixery engine has no `nix` of its own, so CI pulls
# the same toolchain the devShell declares and drives the Makefile directly.
dependencies:
  nixpkgs:
    - go
    - gcc
    - gnumake
    - gnugrep
    - gawk
    - curl
    - bun

steps:
  - name: "Install dependencies"
    command: "cd web && bun install"

  - name: "Install Go tools"
    command: "make tools-install"

  - name: "Build glean"
    command: "make build"

  - name: "Run tests"
    command: "make test"

  - name: "CRAP score analysis"
    command: "make crap"
