name: Enable pull request auto-merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge
    # Draft pull requests cannot be auto-merged. The ready_for_review event
    # enables auto-merge as soon as a draft becomes eligible.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Enable GitHub auto-merge
        env:
          # A merge made with GITHUB_TOKEN does not trigger other workflows, so
          # auto-merged PRs would never run Deploy. A personal access token
          # (contents + pull requests: write) makes the merge a normal push.
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}
          HAS_PAT: ${{ secrets.AUTO_MERGE_TOKEN != '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$HAS_PAT" != "true" ]]; then
            echo "::warning::AUTO_MERGE_TOKEN is not set; this PR will not deploy when auto-merged."
          fi
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --squash
