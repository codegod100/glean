# Railway builds this repo from source. The flake (flake.nix) remains the
# canonical build; this file just names the same toolchain the tangled CI
# declares so `make build` runs unchanged, rather than duplicating its steps.
[phases.setup]
nixPkgs = ["go", "gcc", "gnumake", "gnugrep", "gawk", "bun", "nodejs_22"]

[phases.install]
cmds = ["cd web && bun install"]

[phases.build]
cmds = ["make build"]

[start]
cmd = "./scripts/railway-start.sh"
