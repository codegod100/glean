{{define "articles.html"}}
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold font-title text-spot-text">Articles</h1>
        <form hx-post="/articles/mark-all-read" hx-confirm="Mark all articles as read?">
            {{csrfInput .CSRFToken}}
            {{if .FeedURL}}<input type="hidden" name="feed" value="{{.FeedURL}}">{{end}}
            <button type="submit" class="border border-spot-outline text-spot-text rounded-pill px-4 py-1.5 text-xs font-bold uppercase tracking-button hover:border-spot-text transition">Mark all read</button>
        </form>
    </div>

<div id="article-list" class="space-y-3">
    {{range .Articles}}
    {{template "article-card.html" .}}
    {{else}}
    <div class="text-center text-spot-secondary py-12">No articles found.</div>
    {{end}}
</div>

{{if .HasMore}}
<div class="text-center py-4">
    <button hx-get="/articles?offset={{.NextOffset}}{{if .FeedURL}}&feed={{.FeedURL}}{{end}}{{if .Starred}}&starred=1{{end}}"
            hx-target="#article-list" hx-swap="beforeend"
            hx-select="article"
            class="text-sm text-spot-secondary hover:text-spot-purple transition">
        Load more
    </button>
</div>
{{end}}

<script>
(function() {
    var articles = document.querySelectorAll('#article-list article[data-article-id]');
    var currentIdx = -1;

    function highlightArticle(idx) {
        articles.forEach(function(a) { a.classList.remove('ring-2', 'ring-spot-purple'); });
        if (idx >= 0 && idx < articles.length) {
            currentIdx = idx;
            articles[idx].classList.add('ring-2', 'ring-spot-purple');
            articles[idx].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    }

    function getReadBtn(idx) {
        if (idx < 0 || idx >= articles.length) return null;
        return articles[idx].querySelector('[hx-post*="/read"], [hx-post*="/unread"]');
    }

    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.ctrlKey || e.metaKey || e.altKey) return;

        if (e.key === 'j') {
            e.preventDefault();
            highlightArticle(Math.min(currentIdx + 1, articles.length - 1));
        } else if (e.key === 'k') {
            e.preventDefault();
            highlightArticle(Math.max(currentIdx - 1, 0));
        } else if (e.key === 'o' && currentIdx >= 0) {
            e.preventDefault();
            var link = articles[currentIdx].querySelector('a[href^="/articles/"]');
            if (link) link.click();
        } else if (e.key === 'm' && currentIdx >= 0) {
            e.preventDefault();
            var rbtn = getReadBtn(currentIdx);
            if (rbtn) rbtn.click();
        }
    });
})();
</script>
{{end}}
