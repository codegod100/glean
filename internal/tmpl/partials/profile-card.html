{{define "profile-card.html"}}
<a href="/profile/{{.DID}}" class="bg-spot-surface rounded-xl p-4 flex items-center gap-3 hover:bg-spot-hover-50 transition relative group">
    {{if .AvatarURL}}<img src="{{.AvatarURL}}" class="w-10 h-10 rounded-full">{{end}}
    <div class="min-w-0 flex-1">
        <span class="font-bold text-spot-text hover:text-spot-green transition">@{{.Handle}}</span>
        {{if .IsFollowed}}
        <span class="inline-flex items-center gap-0.5 text-[10px] font-medium text-spot-green bg-spot-green/10 px-1.5 py-0.5 rounded-pill ml-1.5">Following</span>
        {{end}}
        {{if .DisplayName}}<div class="text-sm text-spot-secondary">{{.DisplayName}}</div>{{end}}
    </div>
    <span class="text-xs text-spot-secondary shrink-0">{{.CommonFeeds}} shared</span>
    {{if not .IsFollowed}}
    <button hx-post="/recs/dismiss-person" hx-target="closest .group" hx-swap="outerHTML swap:0.3s"
            hx-vals='{"target_did": "{{.DID}}"}'
            onclick="event.preventDefault(); event.stopPropagation();"
            class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition text-spot-muted hover:text-spot-red p-1 rounded-md hover:bg-spot-red/10" title="Hide">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    {{end}}
</a>
{{end}}
