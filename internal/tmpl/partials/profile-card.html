{{define "profile-card.html"}}
<div class="bg-spot-surface rounded-lg p-4 flex items-center gap-3 hover:bg-spot-hover-50 transition">
    <div class="min-w-0 flex-1">
        <a href="/profile/{{.did}}" class="font-bold text-spot-text hover:text-spot-purple transition">@{{.handle}}</a>
        {{if .display_name}}<div class="text-sm text-spot-secondary">{{.display_name}}</div>{{end}}
    </div>
    <span class="text-xs text-spot-secondary">{{.common_feeds}} shared feeds</span>
</div>
{{end}}
