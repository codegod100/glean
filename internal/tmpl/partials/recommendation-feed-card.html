{{define "recommendation-feed-card.html"}}
<div class="recommendation-card bg-spot-surface rounded-xl p-3 hover:bg-spot-hover-50 transition shadow-spot">
    <div class="flex items-center justify-between gap-2">
        <a href="/articles?feed={{.feed_url}}" class="min-w-0 flex items-center gap-2 flex-1">
            {{template "favicon" dict "src" .favicon_url "size" "w-4 h-4"}}
            <div class="min-w-0">
                <div class="font-bold text-sm text-spot-text truncate">{{if .title}}{{.title}}{{else}}{{.feed_url}}{{end}}</div>
                {{if .description}}<p class="text-xs text-spot-secondary truncate mt-0.5">{{.description}}</p>{{end}}
            </div>
        </a>
        <div class="flex items-center gap-2 shrink-0">
            <span class="text-xs text-spot-secondary">{{.subscriber_count}} subs</span>
            <form hx-post="/recs/dismiss-feed" hx-target="closest .recommendation-card" hx-swap="outerHTML" class="inline-flex items-center">
                {{csrfInput .CSRFToken}}
                <input type="hidden" name="feed_url" value="{{.feed_url}}">
                <button type="submit" title="Not interested" class="text-spot-muted hover:text-spot-red transition p-0.5 rounded hover:bg-spot-hover inline-flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3.5 h-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
                </button>
            </form>
            <form hx-post="/feeds/add" hx-target="closest .recommendation-card" hx-swap="outerHTML" class="inline-flex items-center">
                {{csrfInput .CSRFToken}}
                <input type="hidden" name="feed_url" value="{{.feed_url}}">
                <button type="submit" title="Subscribe" class="text-xs font-bold uppercase tracking-button text-spot-green hover:brightness-110 transition">Subscribe</button>
            </form>
        </div>
    </div>
</div>
{{end}}
