{{define "empty-state.html"}}
<div class="bg-spot-surface rounded-2xl {{if eq .size "compact"}}py-8{{else}}py-12{{end}} px-6 text-center">
    <div class="{{if eq .size "compact"}}w-12 h-12 rounded-xl mb-3{{else}}w-14 h-14 rounded-2xl mb-5{{end}} flex items-center justify-center mx-auto {{if eq .color "red"}}bg-spot-red/15{{else}}bg-spot-green/15{{end}}">
        <svg class="{{if eq .size "compact"}}w-6 h-6{{else}}w-7 h-7{{end}} {{if eq .color "red"}}text-spot-red{{else}}text-spot-green{{end}}" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        {{if eq .icon "icon-sparkles"}}{{template "icon-sparkles"}}
        {{else if eq .icon "icon-trending"}}{{template "icon-trending"}}
        {{else if eq .icon "icon-rss"}}{{template "icon-rss"}}
        {{else if eq .icon "icon-heart"}}{{template "icon-heart"}}
        {{else if eq .icon "icon-annotation"}}{{template "icon-annotation"}}
        {{else if eq .icon "icon-newspaper"}}{{template "icon-newspaper"}}
        {{else if eq .icon "icon-chart"}}{{template "icon-chart"}}
        {{else if eq .icon "icon-people"}}{{template "icon-people"}}
        {{end}}
        </svg>
    </div>
    <p class="text-sm text-spot-text font-semibold mb-1">{{.title}}</p>
    {{if .subtitle}}<p class="text-xs text-spot-muted">{{.subtitle}}</p>{{end}}
</div>
{{end}}
