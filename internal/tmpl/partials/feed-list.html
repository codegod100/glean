{{define "feed-list.html"}}
{{range .Subscriptions}}
<div class="px-5 py-4 flex items-center justify-between hover:bg-spot-hover-50 transition rounded-lg">
    <div class="min-w-0">
        <div class="font-bold text-spot-text">{{.FeedURL}}</div>
        {{if .Category.Valid}}<span class="text-xs text-spot-secondary">{{.Category.String}}</span>{{end}}
    </div>
    <button hx-delete="/feeds/remove" hx-vals='{"url": "{{.FeedURL}}"}' hx-target="closest .px-5" hx-swap="outerHTML swap:0.3s"
            hx-confirm="Unsubscribe from this feed?"
            class="text-sm text-spot-secondary hover:text-spot-red transition">Unsubscribe</button>
</div>
{{else}}
<div class="px-4 py-8 text-center text-spot-secondary">No feeds yet.</div>
{{end}}
{{end}}
