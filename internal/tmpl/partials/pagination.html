{{define "pagination.html"}}
{{if or .HasPrev .HasNext}}
<div class="flex items-center justify-center gap-3 py-6">
    {{if .HasPrev}}
    <a href="{{paginationURL .BaseURL .PrevPage .QueryParams}}" class="px-3 py-1.5 rounded-lg text-sm bg-spot-hover text-spot-text hover:bg-spot-hover-50 transition">&laquo; Prev</a>
    {{else}}
    <span class="px-3 py-1.5 rounded-lg text-sm bg-spot-hover text-spot-muted cursor-not-allowed">&laquo; Prev</span>
    {{end}}

    <span class="text-sm text-spot-secondary">Page {{.Page}}</span>

    {{if .HasNext}}
    <a href="{{paginationURL .BaseURL .NextPage .QueryParams}}" class="px-3 py-1.5 rounded-lg text-sm bg-spot-hover text-spot-text hover:bg-spot-hover-50 transition">Next &raquo;</a>
    {{else}}
    <span class="px-3 py-1.5 rounded-lg text-sm bg-spot-hover text-spot-muted cursor-not-allowed">Next &raquo;</span>
    {{end}}
</div>
{{end}}
{{end}}
