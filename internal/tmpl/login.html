{{define "login.html"}}
<div class="max-w-md mx-auto mt-20">
    <div class="bg-spot-surface rounded-xl shadow-spot-heavy p-8">
        <div class="flex justify-center mb-6">
            <a href="/" class="w-14 h-14 block">{{template "logo-icon"}}</a>
        </div>
        <h1 class="text-2xl font-bold text-spot-text mb-2 text-center">Sign in to Glean</h1>
        <p class="text-spot-secondary text-sm mb-6 text-center">Enter your handle.</p>

        <form action="/auth/start" method="POST" id="login-form">
            {{csrfInput .CSRFToken}}
            <input type="text" name="handle" placeholder="you.bsky.social"
                   class="w-full bg-spot-hover text-spot-text rounded-pill px-5 py-3 mb-5 text-sm focus:outline-none focus:ring-2 focus:ring-spot-green placeholder:text-spot-placeholder"
                   required>
        </form>

        <div class="space-y-3">
            <button type="submit" form="login-form"
                    class="w-full flex items-center justify-center gap-3 bg-[#0284FF] text-white rounded-pill px-4 py-3 text-sm font-bold uppercase tracking-button hover:brightness-110 transition">
                <span class="w-5 h-5">{{template "icon-bluesky"}}</span>
                Sign in with Bluesky
            </button>

            <button type="submit" form="login-form"
                    class="w-full flex items-center justify-center gap-3 border border-spot-outline text-spot-text rounded-pill px-4 py-3 text-sm font-bold uppercase tracking-button hover:bg-spot-hover-50 transition">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">{{template "icon-globe"}}</svg>
                Sign in with Atmosphere
            </button>
        </div>

        <div class="mt-6 pt-6 border-t border-spot-divider text-center">
            <p class="text-xs text-spot-secondary mb-3">No account yet?</p>
            <a href="https://eurosky.social" target="_blank" rel="noopener noreferrer"
               class="inline-flex items-center justify-center gap-2 w-full border border-spot-outline text-spot-text rounded-pill px-4 py-2.5 text-sm font-bold uppercase tracking-button hover:bg-spot-hover-50 transition">
                <span class="text-base">&#127466;&#127482;</span>
                Create an account on Eurosky
            </a>
        </div>
    </div>
</div>
{{end}}
