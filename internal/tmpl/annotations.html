{{define "annotations.html"}}
<div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold font-title text-spot-text">Annotations</h1>
</div>

{{if .ArticleURL}}
<div class="mb-4 text-sm text-spot-secondary">
    Filtering by: <strong class="text-spot-text">{{.ArticleURL}}</strong>
    <a href="/annotations" class="text-spot-green ml-2 hover:brightness-110">Clear</a>
</div>
{{end}}

<div class="space-y-4" id="annotations-list">
    {{range .Annotations}}
    {{template "annotation-card.html" .}}
    {{else}}
    <div class="text-center text-spot-secondary py-12">
        <p>No annotations yet.</p>
        <p class="text-sm mt-1">Highlight and annotate articles as you read.</p>
    </div>
    {{end}}
</div>

{{if .HasMore}}
<div class="text-center py-4">
    <button hx-get="/annotations?offset={{.NextOffset}}{{if .ArticleURL}}&article={{.ArticleURL}}{{end}}"
            hx-target="#annotations-list" hx-swap="beforeend"
            hx-select=".annotation-card"
            class="text-sm text-spot-secondary hover:text-spot-green transition">Load more</button>
</div>
{{end}}
{{end}}
