# sqlite-vec is compiled into the binary rather than loaded at runtime, the
# same way the Go bindings do it. Without SQLITE_CORE the file builds as a
# loadable extension whose entry point reads its SQLite API pointer from the
# caller -- passing nil there segfaults instead of failing, so this define is
# load-bearing, not an optimisation.
--passC:"-DSQLITE_CORE"
--passL:"-lsqlite3 -lm"
